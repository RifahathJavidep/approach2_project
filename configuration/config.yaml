# BA Pipeline Configuration v4.0

llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  max_tokens: 8000
  temperature: 0.3

paths:
  input_dir: "inputs"
  br_gt_dir: "groundtruth"
  tc_gt_dir: "TC_GT"
  output_dir: "output"
  models_dir: "models"

# Document classification: Primary BRDs vs Supporting docs
# Primary docs: Full requirement extraction (Pass 1 + Pass 2)
# Supporting docs: Context-only enrichment (no new requirements created)
document_classification:
  # Auto-detection: files with structured Feature blocks are Primary
  auto_detect: true
  # Override patterns (glob-style): force classification regardless of auto-detect
  primary_patterns:
    - "*Feature*"
    - "*BRD*"
    - "*Requirements_Document*"
  supporting_patterns:
    - "*Solution*"
    - "*Traceability*"
  # JIRA ticket pattern: any filename matching this regex is Supporting
  jira_pattern: "^[A-Z]+-\\d+"

br_gt:
  sheet_name: "Requirements Summary"
  header_row: 1
  columns:
    feature_id: "Feature ID"
    feature_name: "Feature Name"
    description: "Description"
    system: "System"
    requirements: "Requirements"
    test_cases: "Test Cases"
    status: "Status"

tc_gt:
  columns:
    feature: "Feature"
    description: "Description"
    steps: "Steps"
    precondition: "Pre-Condition"
    actual_result: "Actual result"

training:
  br_max_demos: 5
  tc_max_demos: 3
  match_threshold: 0.25

extraction:
  max_doc_chars: 50000
  max_chunk_chars: 6000
  dedup_threshold: 0.55

evaluation:
  similarity_threshold: 0.25
  step_match_threshold: 0.30

# Senior Requested Deployment & Environment Settings
deployment:
  s3:
    bucket_name: "katsu-ai-requirement-documents"
    region: "us-east-2"
    auth_method: "iam_user"  # access_key based for now
  ftp:
    enabled: true
    protocol: "sftp"
    host: "ftp.miipe.team"
    port: 22
    user: "your_username"    # Update in .env OR here
    remote_path: "/uploads"
  rdp:
    remote_rdp:
      host: "10.0.1.50"      # Placeholder for Senior to update
      port: 3389
      user: "Administrator"
    local_rdp:
      host: "localhost"
      port: 3388

environment:
  type: "development"  # Options: production, staging, development
  java_backend_url: "http://localhost:8080"
  redis_url: "rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0"
