# BA Pipeline Configuration v4.0

# ── LLM Settings ─────────────────────────────────────────────
llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  max_tokens: 8000
  temperature: 0.3

# ── Paths (Relative to source_code root) ─────────────────────
paths:
  input_dir: "inputs"
  br_gt_dir: "groundtruth"
  tc_gt_dir: "TC_GT"
  output_dir: "output"
  models_dir: "models"

# ── Deployment & Environment (Senior Requested) ──────────────
deployment:
  s3:
    bucket_name: "katsu-ai-requirement-documents"
    region: "us-east-1"
    # Options: "iam_role" or "access_key"
    auth_method: "iam_role" 
  
  ftp:
    enabled: false
    host: "ftp.example.com"
    port: 21
    user: "deploy_user"
    remote_path: "/uploads"

  rdp:
    remote_rdp:
      host: "10.0.1.50"
      port: 3389
      user: "admin"
    local_rdp:
      host: "localhost"
      port: 3389

  environment:
    type: "production" # development, staging, production
    java_backend_url: "http://java-backend-service:8080"
    redis_url: "redis://redis-cluster:6379/0"

# ── Document classification: Primary BRDs vs Supporting docs ─
document_classification:
  auto_detect: true
  primary_patterns:
    - "*Feature*"
    - "*BRD*"
    - "*Requirements_Document*"
  supporting_patterns:
    - "*Solution*"
    - "*Traceability*"
  jira_pattern: "^[A-Z]+-\\d+"

# ── Data Extraction Logic ────────────────────────────────────
br_gt:
  sheet_name: "Requirements Summary"
  header_row: 1
  columns:
    feature_id: "Feature ID"
    feature_name: "Feature Name"
    description: "Description"
    system: "System"
    requirements: "Requirements"
    test_cases: "Test Cases"
    status: "Status"

tc_gt:
  columns:
    feature: "Feature"
    description: "Description"
    steps: "Steps"
    precondition: "Pre-Condition"
    actual_result: "Actual result"

training:
  br_max_demos: 5
  tc_max_demos: 3
  match_threshold: 0.25

extraction:
  max_doc_chars: 50000
  max_chunk_chars: 6000
  dedup_threshold: 0.55

evaluation:
  similarity_threshold: 0.25
  step_match_threshold: 0.30
