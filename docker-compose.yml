version: "3.9"

# PRISM — Python Services (Extraction + TestGen)
#
# Uses AWS ElastiCache (external) as the Celery broker — no local Redis container needed.
# All API keys are fetched from AWS Secret Manager at startup (utils/secrets.py).
# Non-secret config is set inline below.
#
# Start:   docker-compose up --build
# Monitor: http://localhost:8003  (Celery Flower dashboard)

services:

  # ── Extraction Service  (port 8001) ──────────────────────────────────────────

  extraction-api:
    build:
      context: .
      dockerfile: extraction-service/Dockerfile
    container_name: extraction_api
    ports:
      - "8001:8001"
    environment:
      # AWS Secret Manager — all API keys and credentials live here
      AWS_SECRET_ID: miipe/production
      AWS_DEFAULT_REGION: us-east-1
      IS_DEPLOYED: "true"
      # Celery — AWS ElastiCache (Valkey/Redis, SSL)
      CELERY_BROKER_URL: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
      CELERY_RESULT_BACKEND: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/1
      # S3
      S3_BUCKET_NAME: katsu-ai-requirement-documents
      # Feature flags
      USE_V4_BR_EXTRACTION: "true"
      # Inter-service URLs
      JAVA_BACKEND_URL: http://java-api:8081
      TESTGEN_SERVICE_URL: http://testgen-api:8002
    restart: unless-stopped

  extraction-worker:
    build:
      context: .
      dockerfile: extraction-service/Dockerfile
    command: celery -A celery_app worker --loglevel=info -Q extraction --concurrency=2
    container_name: extraction_worker
    environment:
      AWS_SECRET_ID: miipe/production
      AWS_DEFAULT_REGION: us-east-1
      IS_DEPLOYED: "true"
      CELERY_BROKER_URL: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
      CELERY_RESULT_BACKEND: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/1
      S3_BUCKET_NAME: katsu-ai-requirement-documents
      USE_V4_BR_EXTRACTION: "true"
      JAVA_BACKEND_URL: http://java-api:8081
      TESTGEN_SERVICE_URL: http://testgen-api:8002
    restart: unless-stopped

  # ── TestGen Service  (port 8002) ─────────────────────────────────────────────

  testgen-api:
    build:
      context: .
      dockerfile: testgen-service/Dockerfile
    container_name: testgen_api
    ports:
      - "8002:8002"
    environment:
      AWS_SECRET_ID: miipe/production
      AWS_DEFAULT_REGION: us-east-1
      IS_DEPLOYED: "true"
      CELERY_BROKER_URL: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
      CELERY_RESULT_BACKEND: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/1
      S3_BUCKET_NAME: katsu-ai-requirement-documents
      JAVA_BACKEND_URL: http://java-api:8081
    restart: unless-stopped

  testgen-worker:
    build:
      context: .
      dockerfile: testgen-service/Dockerfile
    command: celery -A celery_app worker --loglevel=info -Q testgen --concurrency=2
    container_name: testgen_worker
    environment:
      AWS_SECRET_ID: miipe/production
      AWS_DEFAULT_REGION: us-east-1
      IS_DEPLOYED: "true"
      CELERY_BROKER_URL: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
      CELERY_RESULT_BACKEND: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/1
      S3_BUCKET_NAME: katsu-ai-requirement-documents
      JAVA_BACKEND_URL: http://java-api:8081
    restart: unless-stopped

  # ── Celery Flower — task monitoring dashboard  (port 8003) ───────────────────

  flower:
    image: mher/flower:2.0
    container_name: celery_flower
    command: >
      celery
      --broker=rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
      flower --port=8003
    ports:
      - "8003:8003"
    environment:
      FLOWER_BROKER_API: rediss://katsu-khru8m.serverless.use1.cache.amazonaws.com:6379/0
    restart: unless-stopped

  # ── Nginx — API Gateway  (port 80) ───────────────────────────────────────────

  nginx:
    build: ./nginx
    container_name: nginx_gateway
    ports:
      - "80:80"
    depends_on:
      - extraction-api
      - testgen-api
    restart: unless-stopped
