version: "3.9"

# ─── Shared environment loaded by both services ─────────────────────────────
# Copy .env.example to .env and fill in your values before running.

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Extraction Service ─────────────────────────────────────────────────────

  extraction-api:
    build:
      context: .
      dockerfile: extraction-service/Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - TESTGEN_SERVICE_URL=http://testgen-api:8001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  extraction-worker:
    build:
      context: .
      dockerfile: extraction-service/Dockerfile
    command: celery -A celery_app worker --loglevel=info -Q extraction --concurrency=2
    env_file: .env
    environment:
      - TESTGEN_SERVICE_URL=http://testgen-api:8001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── TestGen Service ────────────────────────────────────────────────────────

  testgen-api:
    build:
      context: .
      dockerfile: testgen-service/Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  testgen-worker:
    build:
      context: .
      dockerfile: testgen-service/Dockerfile
    command: celery -A celery_app worker --loglevel=info -Q testgen --concurrency=2
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway ────────────────────────────────────────────────────────────

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - extraction-api
      - testgen-api
    restart: unless-stopped
