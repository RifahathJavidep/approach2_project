# MIIPE API Gateway — routes to extraction-service (8001) and testgen-service (8002)

upstream extraction {
    server extraction-api:8001;
}

upstream testgen {
    server testgen-api:8002;
}

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeout for extraction and test generation jobs
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Extraction routes
    location ~ ^/(extract-async|manual-extract|manual-extract-dspy|documents|generate-upload-url|upload-document|requirements|status) {
        proxy_pass http://extraction;
    }

    # TestGen routes
    location ~ ^/(generate-testcases|generate-testcases-sync|testcases) {
        proxy_pass http://testgen;
    }

    location /health {
        proxy_pass http://extraction;
    }

    location /docs {
        proxy_pass http://extraction;
    }

    location /openapi.json {
        proxy_pass http://extraction;
    }
}
