# PRISM API Gateway — Nginx reverse proxy
# Routes requests to extraction-service or testgen-service based on URL prefix.
# All services are internal; only port 80 is exposed to clients.

upstream extraction {
    server extraction-api:8000;
}

upstream testgen {
    server testgen-api:8001;
}

server {
    listen 80;

    # Pass real client IP through to services
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeout for long-running extraction jobs
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Extraction Service routes ───────────────────────────────────────────
    location ~ ^/(extract-async|manual-extract|manual-extract-dspy|documents|generate-upload-url|upload-document|requirements|status) {
        proxy_pass http://extraction;
    }

    # ── TestGen Service routes ──────────────────────────────────────────────
    location ~ ^/(generate-testcases|generate-testcases-sync|testcases) {
        proxy_pass http://testgen;
    }

    # ── Health checks (extraction handles /health by default) ───────────────
    location /health {
        proxy_pass http://extraction;
    }

    # ── API docs (both services expose /docs) ───────────────────────────────
    # Extraction docs: http://localhost/docs
    # TestGen docs:    http://localhost:8001/docs  (direct port access)
    location /docs {
        proxy_pass http://extraction;
    }

    location /openapi.json {
        proxy_pass http://extraction;
    }
}
